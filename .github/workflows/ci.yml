name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: node src/cli.ts check examples/fib.lum --Werror
      - run: node src/cli.ts test examples/tests/arith.lum examples/tests/bits.lum examples/tests/list.lum examples/tests/json.lum examples/tests/maps.lum examples/tests/random.lum examples/tests/sets.lum examples/tests/text.lum examples/tests/options.lum examples/tests/csvs.lum examples/tests/paths.lum examples/tests/statistics.lum examples/tests/heaps.lum examples/tests/queues.lum examples/tests/formats.lum examples/tests/dates.lum examples/tests/matrices.lum examples/tests/regexes.lum
      - run: node src/cli.ts check examples/tests/arith.lum examples/tests/list.lum --Werror
