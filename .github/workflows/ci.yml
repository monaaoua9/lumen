name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: node src/cli.ts check examples/fib.lum --Werror
      - run: node src/cli.ts test examples/tests/arith.lum examples/tests/bits.lum examples/tests/list.lum examples/tests/maps.lum examples/tests/text.lum
